# P1-004: a PR is red when lint, typecheck, the tests, the build or the
# contract drift check fails (05-backlog.md, Phase 6).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # npm run check: generate, generated-diff (the contract half of drift),
  # lint, typecheck and the tests; then a production build.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The other half of drift: contracts/ must equal new-commerce-api's contracts/
  # at some commit on its main (identical or behind), so a PR is green only once
  # the api PR carrying its contract change has merged. Compared by tree hash.
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: contracts/ is a snapshot of new-commerce-api main
        run: |
          want=$(git rev-parse HEAD:contracts)
          git clone -q --filter=blob:none --no-checkout https://github.com/miqbalhamdani/new-commerce-api /tmp/api
          for c in $(git -C /tmp/api log --format=%H -- contracts); do
            if [ "$(git -C /tmp/api rev-parse "$c:contracts" 2>/dev/null)" = "$want" ]; then
              echo "contracts/ = new-commerce-api@$c"; exit 0
            fi
          done
          echo "::error::contracts/ is not a snapshot of new-commerce-api main. Run: npm run contracts"; exit 1

  # P1-001: the image the box runs. Built on every PR so a broken Dockerfile
  # is red; pushed to ghcr.io only from main, as sha-<commit> and main.
  image:
    needs: [check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
